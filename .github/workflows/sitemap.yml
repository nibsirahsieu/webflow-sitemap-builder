name: Build sitemap

on:
  schedule:
    - cron: '17 * * * *' # tiap jam, menit ke-17
  workflow_dispatch: # bisa dijalankan manual dari tab Actions

permissions:
  contents: write

concurrency:
  group: sitemap
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test
        run: npm test

      - name: Build sitemap
        run: node src/build-sitemap.mjs
        env:
          SOURCE_URL: ${{ vars.SOURCE_URL }} # opsional; kosong = pakai sourceUrl di config/rules.json

      - name: Commit jika ada perubahan
        run: |
          git config user.name "sitemap-bot"
          git config user.email "sitemap-bot@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
          else
            git commit -m "chore: update sitemap"
            git push
          fi
